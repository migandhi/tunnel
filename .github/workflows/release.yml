name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - target: server-linux-amd64
            goos: linux
            goarch: amd64
            package: tunnel-server

          - target: server-linux-arm64
            goos: linux
            goarch: arm64
            package: tunnel-server

          - target: client-linux-amd64
            goos: linux
            goarch: amd64
            package: tunnel-client

          - target: client-linux-arm64
            goos: linux
            goarch: arm64
            package: tunnel-client

          - target: client-darwin-amd64
            goos: darwin
            goarch: amd64
            package: tunnel-client

          - target: client-darwin-arm64
            goos: darwin
            goarch: arm64
            package: tunnel-client

          - target: client-windows-amd64
            goos: windows
            goarch: amd64
            package: tunnel-client

          - target: client-windows-arm64
            goos: windows
            goarch: arm64
            package: tunnel-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist

          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/migandhi/tunnel-software/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "dist/tunnel-${{ matrix.target }}" \
            "./cmd/${{ matrix.package }}"

      - name: Rename Windows executable
        if: matrix.goos == 'windows'
        run: |
          mv "dist/tunnel-${{ matrix.target }}" \
             "dist/tunnel-${{ matrix.target }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true